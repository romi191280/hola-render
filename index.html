<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hola</title>
  <style>
    :root {
      --rainbow: linear-gradient(90deg, #ff0000, #ff8000, #ffd000, #22c55e, #0ea5e9, #4f46e5, #a21caf, #ff0000);
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      font-family: system-ui, sans-serif;
      background: #fff;
      color: #111;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 12px;
      background: var(--rainbow);
      background-size: 200% 100%;
      animation: slide 6s linear infinite;
    }
    .rainbow-text {
      background: var(--rainbow);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: slide 6s linear infinite;
    }
    @keyframes slide { to { background-position: -200% 0; } }

    h1 {
      margin: 0;
      font-size: clamp(4rem, 18vw, 9rem);
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    #heart {
      background: none;
      border: 0;
      padding: 0.5rem;
      cursor: pointer;
      border-radius: 50%;
      animation: beat 1.4s ease-in-out infinite;
      -webkit-tap-highlight-color: transparent;
    }
    #heart svg { width: 96px; height: 96px; display: block; filter: drop-shadow(0 6px 10px rgba(255, 30, 80, .35)); }
    #heart:hover { transform: scale(1.12); }
    #heart:active { transform: scale(0.92); }
    #heart:focus-visible { outline: 3px solid #4f46e5; outline-offset: 4px; }
    @keyframes beat {
      0%, 100% { scale: 1; }
      15% { scale: 1.12; }
      30% { scale: 1; }
      45% { scale: 1.08; }
    }

    #mensaje {
      margin: 0;
      min-height: 1.2em;
      font-size: clamp(1.8rem, 8vw, 3.5rem);
      font-weight: 800;
      text-align: center;
      opacity: 0;
      transform: scale(0.5);
    }
    #mensaje.visible {
      opacity: 1;
      transform: scale(1);
      transition: opacity .3s, transform .5s cubic-bezier(.2, 1.6, .4, 1);
    }

    #confeti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      #heart, body::before, .rainbow-text { animation: none; }
    }
  </style>
</head>
<body>
  <h1 class="rainbow-text">hola</h1>

  <button id="heart" type="button" aria-label="Presioná el corazón">
    <svg viewBox="0 0 32 29" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff5c8a"/>
          <stop offset="1" stop-color="#e11d48"/>
        </linearGradient>
      </defs>
      <path fill="url(#g)" d="M23.6 0c-3.4 0-5.7 2-7.6 4.4C14.1 2 11.8 0 8.4 0 3.7 0 0 3.7 0 8.4c0 9.2 10.7 14.7 14.9 19.7.6.7 1.6.7 2.2 0C21.3 23.1 32 17.6 32 8.4 32 3.7 28.3 0 23.6 0z"/>
    </svg>
  </button>

  <p id="mensaje" class="rainbow-text" aria-live="polite">SÉ FELIZ HOY</p>

  <canvas id="confeti"></canvas>

  <script>
    const canvas = document.getElementById('confeti');
    const ctx = canvas.getContext('2d');
    const colores = ['#ff0000', '#ff8000', '#ffd000', '#22c55e', '#0ea5e9', '#4f46e5', '#a21caf', '#ff4d9d'];
    let piezas = [];
    let animando = false;

    function ajustar() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener('resize', ajustar);
    ajustar();

    function lanzar(x, y) {
      for (let i = 0; i < 160; i++) {
        const ang = Math.random() * Math.PI * 2;
        const vel = 4 + Math.random() * 11;
        piezas.push({
          x, y,
          vx: Math.cos(ang) * vel,
          vy: Math.sin(ang) * vel - 7,
          w: 6 + Math.random() * 8,
          h: 4 + Math.random() * 6,
          rot: Math.random() * Math.PI * 2,
          vr: (Math.random() - 0.5) * 0.4,
          color: colores[(Math.random() * colores.length) | 0],
          vida: 0
        });
      }
      if (!animando) { animando = true; requestAnimationFrame(frame); }
    }

    function frame() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      piezas = piezas.filter(p => p.y < innerHeight + 40 && p.vida < 300);
      for (const p of piezas) {
        p.vx *= 0.985;
        p.vy += 0.28;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.vida++;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (piezas.length) requestAnimationFrame(frame);
      else { animando = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
    }

    const mensaje = document.getElementById('mensaje');
    document.getElementById('heart').addEventListener('click', (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      lanzar(r.left + r.width / 2, r.top + r.height / 2);
      mensaje.classList.add('visible');
    });
  </script>
</body>
</html>
