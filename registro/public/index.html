<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro de Personas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: una columna estrecha, formulario arriba y libro de registro debajo */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #1b2230; --muted: #5d6676;
  --line: #dde1e8; --accent: #2b5fd9; --accent-fg: #ffffff; --danger: #b3261e; --ok: #1e7a4a;
  --display: "Fraunces", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --surface: #1a1f28; --fg: #e7eaf0; --muted: #9aa3b2;
  --line: #2c3340; --accent: #7aa2ff; --accent-fg: #0d1220; --danger: #ff8a80; --ok: #6fd39c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1f28; --fg: #e7eaf0; --muted: #9aa3b2;
  --line: #2c3340; --accent: #7aa2ff; --accent-fg: #0d1220; --danger: #ff8a80; --ok: #6fd39c; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px 64px; }
main { max-width: 680px; margin: 0 auto; display: grid; gap: 32px; }
h1 { font-family: var(--display); font-weight: 600; font-size: 2rem; margin: 0; text-wrap: balance; }
h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; font-weight: 600; }
header p { margin: 6px 0 0; color: var(--muted); }

form { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 16px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
label { display: grid; gap: 6px; font-weight: 500; font-size: .9rem; }
input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); min-width: 0; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
button { font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px; border: 1px solid transparent; padding: 10px 18px; }
.primary { background: var(--accent); color: var(--accent-fg); }
.primary:disabled { opacity: .5; cursor: not-allowed; }
#msg { font-size: .9rem; }
#msg.error { color: var(--danger); } #msg.ok { color: var(--ok); }

.list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
#count { font-family: var(--mono); font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
ol { list-style: none; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--line); }
li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.who { min-width: 0; }
.name { font-weight: 600; }
.email { font-family: var(--mono); font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
.date { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.del { background: none; color: var(--muted); border-color: var(--line); padding: 6px 10px; font-size: .85rem; font-weight: 500; }
.del.confirm { color: var(--danger); border-color: var(--danger); }
.empty { color: var(--muted); padding: 20px 0; }

.admin { display: grid; gap: 12px; }
.admin form { grid-template-columns: 1fr auto; align-items: end; }
@media (max-width: 520px) { .admin form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Registro de personas</h1>
    <p>Déjanos tu nombre, apellido y correo para registrarte.</p>
  </header>

  <form id="form" novalidate>
    <div class="row">
      <label for="nombre">Nombre<input id="nombre" autocomplete="given-name" required maxlength="80"></label>
      <label for="apellido">Apellido<input id="apellido" autocomplete="family-name" required maxlength="80"></label>
    </div>
    <label for="email">Correo electrónico<input id="email" type="email" autocomplete="email" required maxlength="160" placeholder="nombre@ejemplo.com"></label>
    <div class="actions">
      <button class="primary" id="submit" type="submit">Registrar</button>
      <span id="msg" role="status"></span>
    </div>
  </form>

  <section class="admin">
    <div class="list-head"><h2>Personas registradas</h2><span id="count"></span></div>
    <form id="login">
      <label for="key">Clave de administración<input id="key" type="password" autocomplete="current-password"></label>
      <button class="primary" type="submit">Ver lista</button>
    </form>
    <span id="adminMsg" role="status"></span>
    <ol id="list" hidden></ol>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
